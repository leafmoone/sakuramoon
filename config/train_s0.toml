extends = ["base.toml"]

[sampling.training]
enabled = true
every_updates = 200
image_count = 12
output_subdir = "sample"

[run]
run_id = "s0-production-compile-none-bs40-acc10-20260813"
seed = 44
# Display-only run label; it never selects backend, depth, or growth behavior.
label = "S0"

[paths]
run_dir = "runs/s0"
checkpoint_dir = "output_model/s0"
artifact_dir = "artifacts/s0"

[distributed]
backend = "accelerate"
world_size = 2

[checkpoint]
full_every_updates = 100
slots = 2

[data.cache]
low_watermark_gib = 192
high_watermark_gib = 256
download_concurrency = 8
verified_shard_lookahead = 48
persistent_workers_per_rank = 8
ready_batches_per_rank = 8

[data.service]
request_timeout_seconds = 30.0
lease_channel_capacity = 24
ack_channel_capacity = 24

[data.transport]
connect_timeout_seconds = 10.0
read_timeout_seconds = 30.0
stream_chunk_bytes = 1048576
streams_per_shard = 4

[growth]
enabled = false

[kernels]
torch_compile_enabled = true
torch_compile_dynamic = true

[train]
resolution = 256
local_batch = 38
accumulation = 10
# Effective global batch is local_batch * accumulation * world_size = 760;
# the explicit value is a consistency assertion only.
global_batch = 760
# Absolute successful-update terminal for this run.
max_updates = 100000
activation_checkpoint_mode = "none"

[model.dit]
depth = 16

[logging]
local_jsonl_path = "artifacts/s0/metrics.jsonl"
flush_every_updates = 1
async_remote = true
noise_observation_boundary = 0.95
observer_queue_capacity = 64
observer_event_timeout_seconds = 30.0

[wandb]
enabled = true
retry_jsonl_path = "artifacts/s0/wandb-retry.jsonl"
queue_capacity = 64

[evaluation]
enabled = true
every_updates = 5000
sample_count = 1000
real_sample_count = 34849
batch_size = 64
is_splits = 10
kid_subsets = 100
kid_subset_size = 1000
prompt_path = "data/validation-cohorts/s0-validation-50k-v1/validation-prompts.json"
validation_shard_root = "data/validation-cohorts/s0-validation-50k-v1/shards"
output_dir = "output_model/evaluation/s0"
sampling_profile = "preview"
