extends = ["base.toml"]

[run]
run_id = "s0-production"
stage = "S0"
seed = 44

[paths]
run_dir = "runs/s0"
checkpoint_dir = "output_model/s0"
artifact_dir = "artifacts/s0"

[distributed]
backend = "native"
world_size = 1
frozen_encoders_outside_wrapper = true
automatic_backend_fallback = false

[checkpoint]
full_every_updates = 100
slots = 2

[data.cache]
low_watermark_gib = 32
high_watermark_gib = 64
download_concurrency = 8
verified_shard_lookahead = 50
persistent_workers_per_rank = 4
ready_batches_per_rank = 8

[data.service]
request_timeout_seconds = 30.0
lease_channel_capacity = 4
ack_channel_capacity = 4

[data.transport]
connect_timeout_seconds = 10.0
read_timeout_seconds = 30.0
stream_chunk_bytes = 1048576
streams_per_shard = 4

[growth]
enabled = false
alpha_schedule = "half_cosine"
alpha_fraction = 0.02
min_updates = 1000
max_updates = 5000
random_new_slots = true
copy_old_slots = false

[stage]
name = "S0"
enabled = true
predecessor = ""
world_size = 1
depth = 16
resolution = 256
local_batch = 40
accumulation = 8
global_batch = 320
activation_checkpoint_mode = "all"
planned_updates = 100000
manual_finalize = true
automatic_transition = false

[logging]
local_jsonl_path = "artifacts/s0/metrics.jsonl"
flush_every_updates = 1
async_remote = true
noise_observation_boundary = 0.95
observer_queue_capacity = 64
observer_event_timeout_seconds = 30.0

[wandb]
enabled = true
retry_jsonl_path = "artifacts/s0/wandb-retry.jsonl"
queue_capacity = 64

[evaluation]
enabled = true
every_updates = 1000
sample_count = 1000
batch_size = 64
is_splits = 10
prompt_path = "data/validation-cohorts/s0-validation-50k-v1/validation-prompts.json"
validation_shard_root = "data/validation-cohorts/s0-validation-50k-v1/shards"
output_dir = "output_model/evaluation/s0"
sampling_profile = "preview"
