# Camera v2 shifted-square canary (P25): 25% camera policy.
# A fixed 25% of samples (independent camera-policy RNG) train one
# stage-edge R x R square view per source sample (crop-after-scale: short
# edge scaled to R, long edge quantized by rounding half up, uniform
# inclusive integer offset on the long axis); selected sources whose
# post-EXIF short edge is below R are rejected (no-upscale rule) and never
# returned to an ordinary bucket. Non-selected samples keep the ordinary
# dev path bit-identically.
#
# Data strategy change only -- model architecture, optimizer, LR, batch,
# objective and checkpoint schema are untouched. Extends the live G1 run
# config (bs800 / lr flat / seed 44, train.resolution = 256) and overrides
# exactly:
#   - run identity and fully independent run/checkpoint/artifact paths
#   - [data.camera_viewport]: p=0.25
#
# Activation is config-only: the camera path runs iff enabled and
# probability > 0. [data.spatial_crop] is disabled by the inherited live G1
# config, so no override is needed; an active camera and spatial_crop are
# mutually exclusive by config validator.
#
# NOT deployed: the canary starts only after an explicit user GO; it then
# resumes from a COMPLETE production checkpoint via scripts/training_stack.sh
# (see AGENTS.md for the launch contract).

extends = ["train_g1.toml"]

[run]
run_id = "g1_camera_v2_p25"

[paths]
run_dir = "runs/g1_camera_v2_p25"
checkpoint_dir = "output_model/g1_camera_v2_p25"
artifact_dir = "artifacts/g1_camera_v2_p25"

[logging]
local_jsonl_path = "artifacts/g1_camera_v2_p25/metrics.jsonl"

[wandb]
retry_jsonl_path = "artifacts/g1_camera_v2_p25/wandb-retry.jsonl"

[evaluation]
output_dir = "output_model/evaluation/g1_camera_v2_p25"

[data.camera_viewport]
enabled = true
mode = "hdm_shifted_square_v2"
probability = 0.25
viewport = "stage_square"
offset_distribution = "uniform_long_axis_inclusive"
zoom_source = "natural_source_aspect"
