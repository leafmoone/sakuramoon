extends = ["base.toml"]

[run]
run_id = "s3-production"
stage = "S3"
seed = "REQUIRED_S3_SEED"

[paths]
run_dir = "runs/s3"
checkpoint_dir = "checkpoints/s3"
artifact_dir = "artifacts/s3"

[distributed]
backend = "ddp"
world_size = 4
frozen_encoders_outside_wrapper = true
automatic_backend_fallback = false

[checkpoint]
slots = "BENCHMARK_S3_CHECKPOINT_SLOTS"

[growth]
enabled = false
alpha_schedule = "half_cosine"
alpha_fraction = 0.02
min_updates = 1000
max_updates = 5000
random_new_slots = true
copy_old_slots = false

[stage]
name = "S3"
enabled = true
predecessor = "G2"
world_size = 4
depth = 24
resolution = 512
local_batch = "BENCHMARK_S3_LOCAL_BATCH"
accumulation = "BENCHMARK_S3_ACCUMULATION"
global_batch = "BENCHMARK_S3_GLOBAL_BATCH"
activation_checkpoint_mode = "BENCHMARK_S3_ACTIVATION_CHECKPOINT_MODE"
planned_updates = "BENCHMARK_S3_PLANNED_UPDATES"
planned_valid_samples = "BENCHMARK_S3_PLANNED_VALID_SAMPLES"
planned_equivalent_data_passes = "BENCHMARK_S3_EQUIVALENT_DATA_PASSES"
planned_dit_flops = "BENCHMARK_S3_DIT_FLOPS"
planned_wall_time_hours = "BENCHMARK_S3_WALL_TIME_HOURS"
manual_finalize = true
automatic_transition = false

[logging]
local_jsonl_path = "artifacts/s3/metrics.jsonl"
flush_every_updates = "BENCHMARK_S3_METRICS_FLUSH_UPDATES"
async_remote = true
noise_observation_boundary = 0.95

[wandb]
retry_jsonl_path = "artifacts/s3/wandb-retry.jsonl"
