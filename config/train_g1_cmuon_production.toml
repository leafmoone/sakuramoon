# PRODUCTION CMuon continuation (cutover anchor successful_update=111500).
#
# All leaves identical to the live production config
# train_g1_transparent_white_crop_800_s0.toml (base->train_g1->s0 chain),
# EXCEPT the [optimizer] subtree, which is exactly the effective [optimizer]
# of the frozen candidate chain (base->train_g1->s0->ns4_core->fp32_rescue),
# i.e. the optimizer subtree validated by the 09-02 CMuon->dev integration
# Arm B (100u live + fresh resume, all safety gates PASS).
# run_id, run identity, checkpoint dir, data policies, LR, cadence, growth,
# compilation and everything else are inherited UNCHANGED.
extends = ["train_g1_transparent_white_crop_800_s0.toml"]

[optimizer]
name = "hybrid_cmuon_canonical_ns4_fp32_rescue"
base_lr = 5e-05
reference_batch = 256
lr_scaling = "linear_global_batch"
betas = [0.9, 0.95]
eps = 1e-08
block_size = 256
bf16_stochastic_round = true
matrix_weight_decay = 0.0
sensitive_weight_decay = 0.0
cmuon_momentum_dtype = "bfloat16"
cmuon_chunk_rescale_sqrt_n = false

[optimizer.cmuon_ns]
default = 4

[optimizer.cmuon_ns_telemetry]
enabled = false
log_every_n = 100
roles = []

[optimizer.cmuon_guard]
enabled = true
guard_ratio = 0.1
reference_decay = 0.999
min_reference = 3.096e-08
numerical_floor = 6.575e-07
warmup_observations = 50
invariant_check = true

