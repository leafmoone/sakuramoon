extends = ["base.toml"]

[run]
run_id = "h2-disabled"
intent = "template"
stage = "H2"
seed = "REQUIRED_H2_SEED"

[paths]
run_dir = "runs/h2"
checkpoint_dir = "checkpoints/h2"
artifact_dir = "artifacts/h2"

[distributed]
backend = "ddp"
world_size = 4
frozen_encoders_outside_wrapper = true
automatic_backend_fallback = false

[checkpoint]
slots = "BENCHMARK_H2_CHECKPOINT_SLOTS"

[growth]
enabled = false
alpha_schedule = "half_cosine"
alpha_fraction = 0.02
min_updates = 1000
max_updates = 5000
random_new_slots = true
copy_old_slots = false

[stage]
name = "H2"
enabled = false
predecessor = "H1"
world_size = 4
depth = 24
resolution = 1024
local_batch = "BENCHMARK_H2_LOCAL_BATCH"
accumulation = "BENCHMARK_H2_ACCUMULATION"
global_batch = "BENCHMARK_H2_GLOBAL_BATCH"
activation_checkpoint_mode = "BENCHMARK_H2_ACTIVATION_CHECKPOINT_MODE"
planned_updates = "BENCHMARK_H2_PLANNED_UPDATES"
manual_finalize = true
automatic_transition = false

[logging]
local_jsonl_path = "artifacts/h2/metrics.jsonl"
flush_every_updates = "BENCHMARK_H2_METRICS_FLUSH_UPDATES"
async_remote = true
noise_observation_boundary = 0.95

[wandb]
retry_jsonl_path = "artifacts/h2/wandb-retry.jsonl"
