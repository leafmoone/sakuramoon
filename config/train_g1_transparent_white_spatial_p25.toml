# transparent-white + shifted_bucket_v1 combo canary (p=0.25): the
# transparent_background white-composite policy runs together with the
# shifted-bucket spatial crop, which trains the full-canvas 2D RoPE
# zoom/shift on a larger canvas cropped back to the aspect bucket on 25% of
# samples.
#
# Extends the transparent-white canary (train_g1_transparent_white.toml),
# which already carries the G1 batch shape (19 * 20 * 2 = 760, world 2), the
# 0.0000475 base_lr anchor, and the full [data.transparent_background] reject
# sets, and overrides exactly:
#   - run identity and fully independent run/checkpoint/artifact paths
#   - [data.spatial_crop]: p=0.25, equivalent zoom 1.02-1.10
#
# Data-strategy change only -- model / loss / growth / budget are untouched.
# Launch via scripts/training_stack.sh from the checkpoint designated at
# cutover time; the preflight resume contract pins the source checkpoint's
# saved optimizer learning rate and batch protocol to this config exactly,
# and the resolved-config transition audit bounds every other cutover drift
# to the data-policy envelope.

extends = ["train_g1_transparent_white.toml"]

[run]
run_id = "g1_transparent_white_spatial_p25"

[paths]
run_dir = "runs/g1_transparent_white_spatial_p25"
checkpoint_dir = "output_model/g1_transparent_white_spatial_p25"
artifact_dir = "artifacts/g1_transparent_white_spatial_p25"

[logging]
local_jsonl_path = "artifacts/g1_transparent_white_spatial_p25/metrics.jsonl"

[wandb]
retry_jsonl_path = "artifacts/g1_transparent_white_spatial_p25/wandb-retry.jsonl"

[evaluation]
output_dir = "output_model/evaluation/g1_transparent_white_spatial_p25"

[data.spatial_crop]
enabled = true
mode = "shifted_bucket"
probability = 0.25
min_equivalent_zoom = 1.02
max_equivalent_zoom = 1.10
zoom_distribution = "sqrt_uniform_high"
offset_distribution = "uniform_independent"
fallback_to_aspect_bucket = true
