# Checkpoint-driven formal evaluator identity. T052/S000 replace the explicit
# external-stat and resource placeholders inherited from the production base.
extends = ["train_s0.toml"]

[run]
run_id = "reference-evaluation"
intent = "eval"

[paths]
run_dir = "runs/eval"
checkpoint_dir = "checkpoints/eval"
artifact_dir = "artifacts/eval"

[sampling]
profile = "reference"

[logging]
local_jsonl_path = "artifacts/eval/metrics.jsonl"

[wandb]
retry_jsonl_path = "artifacts/eval/wandb-retry.jsonl"

[evaluation]
enabled = true
stage_end = true
explicit_job = true
gpu_index = 0
training_paused = true
batch_size = "BENCHMARK_EVALUATION_BATCH_SIZE"
output_reserve_gib = "BENCHMARK_EVALUATION_OUTPUT_RESERVE_GIB"

[evaluation.sampling]
profile = "reference"

[evaluation.extractor]
enabled = true
feature_extractor = "REQUIRED_FID_IS_FEATURE_EXTRACTOR"
feature_extractor_version = "REQUIRED_FID_IS_FEATURE_EXTRACTOR_VERSION"
feature_extractor_path = "REQUIRED_FID_IS_FEATURE_EXTRACTOR_PATH"
preprocess_path = "REQUIRED_FID_IS_PREPROCESS_PATH"

[evaluation.fid]
enabled = true
every_successful_updates = 1000
trend_samples = "BENCHMARK_FID_TREND_SAMPLES"
acceptance_samples = "BENCHMARK_FID_ACCEPTANCE_SAMPLES"
real_stats_path = "REQUIRED_FID_REAL_STATS_PATH"

[evaluation.is]
enabled = true
every_successful_updates = 1000
trend_samples = "BENCHMARK_IS_TREND_SAMPLES"
acceptance_samples = "BENCHMARK_IS_ACCEPTANCE_SAMPLES"
splits = "BENCHMARK_IS_SPLITS"

[evaluation.manual_quality]
enabled = true
samples = "BENCHMARK_MANUAL_QUALITY_SAMPLES"
