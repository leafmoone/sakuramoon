# Documentation-only inventory of every C001 key. This file is intentionally
# not runnable: undecided values use explicit sentinels rejected by the loader.
# Units appear in key names or comments. Fixed values require an architecture
# decision before they may change; benchmark values require measured evidence.

schema_version = 1 # fixed

[run]
run_id = "example-not-for-training"
stage = "S0" # S0|S1|G1|S2|G2|S3|H1|H2
seed = 0 # integer >= 0

[paths]
run_dir = "runs/example"
cache_dir = "cache/data"
checkpoint_dir = "checkpoints/example"
artifact_dir = "artifacts/example"

[security]
# Names only. Credential values must exist in the process environment and are
# never serialized into resolved TOML or hashes.
modelscope_token_env = "MODELSCOPE_API_TOKEN"
wandb_api_key_env = "WANDB_API_KEY"

[assets.qwen]
local_path = "model/qwen_3.5_2B" # fixed local-only path; never downloaded
dtype = "bfloat16" # fixed
frozen = true # fixed
layers = 24 # fixed
hidden_size = 2048 # fixed
use_cache = false # fixed
visual_path_enabled = false # fixed

[assets.vae]
local_path = "model/vae" # fixed local-only path; never downloaded
dtype = "bfloat16" # fixed
frozen = true # fixed
latent_channels = 128 # fixed
downsample_factor = 16 # fixed
sample_posterior = false # fixed

[data.source]
repo_id = "leafmoone/webdataset_danbooru" # fixed
revision = "REQUIRED_IMMUTABLE_REVISION"

[data.manifest]
path = "REQUIRED_TRAIN_MANIFEST_PATH"
sha256 = "REQUIRED_IMMUTABLE_SHA256"

[data.cache]
low_watermark_gib = "BENCHMARK_REQUIRED" # integer, 300 <= low < high
high_watermark_gib = "BENCHMARK_REQUIRED" # integer, low < high <= 500
download_concurrency = "BENCHMARK_REQUIRED" # integer > 0
range_workers = "BENCHMARK_REQUIRED" # integer > 0
persistent_workers_per_rank = "BENCHMARK_REQUIRED" # integer > 0
ready_batches_per_rank = "BENCHMARK_REQUIRED" # integer > 0

[data.transport]
connect_timeout_seconds = "BENCHMARK_REQUIRED" # TOML float, 0 < value <= 300
read_timeout_seconds = "BENCHMARK_REQUIRED" # TOML float, 0 < value <= 300
max_retries = "BENCHMARK_REQUIRED" # integer, 0 <= value <= 10
retry_backoff_seconds = "BENCHMARK_REQUIRED" # TOML float, 0 <= value <= 60
stream_chunk_bytes = "BENCHMARK_REQUIRED" # integer, 65536 <= value <= 16777216

[data.validation]
manifest_path = "REQUIRED_VALIDATION_MANIFEST_PATH"
manifest_sha256 = "REQUIRED_IMMUTABLE_SHA256"
sample_count = 2000 # fixed
exclude_before_shuffle = true # fixed

[data.image]
exif_transpose = true # fixed
color_mode = "RGB" # fixed
no_upscale = true # fixed
preserve_aspect_ratio = true # fixed
allow_padding = false # fixed
min_crop_retention = 0.8 # fixed fraction

[data.buckets]
base_area_px = 262144 # fixed, 512^2
quantum_px = 32 # fixed
min_short_edge_px = 256 # fixed
max_aspect_ratio = 4.0 # fixed
shape_count = 17 # fixed
transpose_closed = true # fixed

[caption]
category_order = ["nsfw", "character", "copyright", "general", "nl"] # fixed
tag_separator = ", " # fixed
tag_nl_separator = "\n\n" # fixed
text_condition_max = 512 # fixed condition tokens
condition_buckets = [64, 128, 192, 256, 320, 384, 448, 512] # fixed
qwen_dense_lengths = [98, 162, 226, 290, 354, 418, 482, 546] # fixed

[caption.dropout]
all_condition = 0.10 # fixed
general = 0.1 # fixed
artist = 0.1 # fixed
character = 0.2 # fixed
copyright = 0.1 # fixed
nsfw = 0.1 # fixed
candidate_source = 0.3 # fixed

[caption.dropout.nl]
# All five NL branches use the same fixed dropout probability.
long_names = 0.3 # fixed
long_no_names = 0.3 # fixed
short_vibes = 0.3 # fixed
nl2 = 0.3 # fixed
nl3 = 0.3 # fixed

[model.text]
hidden_state_blocks = [2, 4, 8, 12, 16, 20, 24] # fixed, after block
input_size = 2048 # fixed
adapter_size = 1024 # fixed
output_size = 2560 # fixed
groups = 8 # fixed
bidirectional_attention_layers = 1 # fixed
no_positional_encoding = true # fixed

[model.style]
query_count = 4 # fixed
input_size = 2048 # fixed
hidden_size = 1024 # fixed
mlp_intermediate_size = 2048 # fixed
output_size = 2560 # fixed
null_tokens_learned = true # fixed

[model.packing]
order = ["text", "style", "image"] # fixed
style_tokens = 4 # fixed
remove_text_padding = true # fixed
cross_sample_attention = false # fixed
modality_init_std = 0.02 # fixed

[model.rope]
head_dim = 128 # fixed
nope_dim = 32 # fixed
y_dim = 48 # fixed
x_dim = 48 # fixed
position_scale = 16.0 # fixed
theta = 1000.0 # fixed
cell_center = true # fixed
area_normalized = true # fixed

[model.dit]
hidden_size = 2560 # fixed
head_dim = 128 # fixed
q_heads = 20 # fixed
kv_heads = 5 # fixed
intermediate_size = 6912 # fixed
patch_size = 1 # fixed
attention_dropout = 0.0 # fixed
mlp_dropout = 0.0 # fixed
projection_bias = false # fixed
norm_eps = 0.000001 # fixed
norm_accumulation = "float32" # fixed
activation_dtype = "bfloat16" # fixed

[model.condition]
timestep_dim = 256 # fixed
size_dim = 64 # fixed
aspect_dim = 64 # fixed
input_dim = 384 # fixed
hidden_dim = 1024 # fixed
block_modulation_chunks = 6 # fixed
shared_projection_zero_init = true # fixed
per_block_bias_zero_init = true # fixed

[model.head]
final_modulation_size = 5120 # fixed
out_channels = 128 # fixed
prediction_type = "x" # fixed
image_span_only = true # fixed
weight_zero_init = true # fixed
bias_zero_init = true # fixed

[objective]
prediction_type = "x" # fixed
interpolation = "z_t=t*x+(1-t)*epsilon" # fixed
velocity_loss_dtype = "float32" # fixed
reduction = "per_sample_then_global_sample_mean" # fixed

[timestep]
distribution = "jlt" # fixed
p_mean = -0.8 # fixed
p_std = 0.8 # fixed
noise_scale = 1.0 # fixed
t_eps = 0.05 # fixed

[sampling]
solver = "heun_linear_time_final_euler" # fixed
steps = 50 # fixed
nfe = 99 # fixed
state_dtype = "float32" # fixed

[cfg]
scale = 2.9 # fixed
full_interval = true # fixed
rescale = false # fixed
conversion_order = "each_x_to_v_then_cfg" # fixed

[optimizer]
name = "torchao_adamw8bit" # fixed
lr = 0.00002 # fixed
betas = [0.9, 0.95] # fixed
eps = 0.00000001 # fixed
block_size = 256 # fixed
bf16_stochastic_round = true # fixed
matrix_weight_decay = 0.01 # fixed
sensitive_weight_decay = 0.0 # fixed

[scheduler]
name = "wsd" # fixed
warmup_updates = 2000 # fixed successful updates
stable_lr = 0.00002 # fixed
decay_lr = 0.000002 # fixed
automatic_decay = false # fixed

[gradient]
clip_norm = 1.0 # fixed global norm
clip_dtype = "float32" # fixed
global_sample_mean = true # fixed

[distributed]
backend = "native" # native for S0; ddp thereafter
world_size = 1 # fixed by stage
frozen_encoders_outside_wrapper = true # fixed
automatic_backend_fallback = false # fixed

[checkpoint]
kind = "raw" # fixed
full_every_updates = 1000 # fixed successful updates
full_every_hours = 6.0 # fixed wall hours
slots = "BENCHMARK_REQUIRED" # integer > 0 with reserved capacity evidence
atomic_complete_marker = true # fixed
checksum_required = true # fixed
canonical_fqn = true # fixed

[growth]
enabled = false # true only for G1/G2
alpha_schedule = "half_cosine" # fixed
alpha_fraction = 0.02 # fixed fraction of planned updates
min_updates = 1000 # fixed
max_updates = 5000 # fixed
random_new_slots = true # fixed
copy_old_slots = false # fixed

[stage]
name = "S0"
enabled = true
predecessor = ""
world_size = 1
depth = 16
resolution = 256 # pixels, equivalent-area stage
local_batch = "BENCHMARK_REQUIRED" # integer > 0
accumulation = "BENCHMARK_REQUIRED" # integer > 0
planned_updates = "BENCHMARK_REQUIRED" # integer > 0
manual_finalize = true # fixed
automatic_transition = false # fixed

[kernels]
attention_backend = "dense_sdpa_reference" # explicit engineering reference
production_attention_backend = "fa4_varlen" # fixed target
reference_attention_backend = "dense_sdpa_reference" # fixed
dtype = "bfloat16" # fixed
native_gqa = true # fixed
repeat_kv_heads = false # fixed
silent_fallback = false # fixed

[compile]
regional_enabled = false
minimum_end_to_end_gain_percent = 3.0 # fixed gate, percent
automatic_enable = false # fixed

[profiling]
enabled = false
schedule_updates = "BENCHMARK_REQUIRED" # integer > 0
record_shapes = true
profile_memory = true

[benchmark]
kind = "candidate"
warmup_updates = 100 # fixed candidate/final warmup
measured_updates = 500 # candidate fixed; final config must use >= 1000
starting_successful_update = 899 # measured window starts at update 1000
profile_trace_updates = "BENCHMARK_REQUIRED" # integer in measured window
same_workload_required = true # fixed
nsight_compute_hotspot_only = true # fixed

[failure]
stop_on_nonfinite = true # fixed
stop_on_oom = true # fixed
stop_on_rank_divergence = true # fixed
allow_force_bypass = false # fixed
automatic_batch_change = false # fixed
automatic_backend_change = false # fixed

[logging]
local_jsonl_path = "artifacts/example/metrics.jsonl"
flush_every_updates = "BENCHMARK_REQUIRED" # integer > 0
async_remote = true # fixed

[wandb]
enabled = true
project = "sakuramoon"
entity = "REQUIRED_WANDB_ENTITY"
offline_on_network_error = true # fixed; training semantics do not change

[timing]
enabled = true
cuda_events = true # fixed
force_synchronize_each_phase = false # fixed
phases = [
  "data", "qwen", "vae", "conditioning", "dit_forward", "loss",
  "backward", "ddp", "clip", "optimizer", "checkpoint", "evaluation",
] # fixed set

[evaluation]
stage_end = true
explicit_job = true # fixed
prompt_manifest_path = "REQUIRED_PROMPT_MANIFEST_PATH"
prompt_manifest_sha256 = "REQUIRED_IMMUTABLE_SHA256"
gpu_index = "BENCHMARK_REQUIRED" # integer >= 0
training_paused = "BENCHMARK_REQUIRED" # boolean; evaluator resource plan

[evaluation.sampling]
solver = "heun_linear_time_final_euler" # fixed
steps = 50 # fixed
nfe = 99 # fixed
state_dtype = "float32" # fixed

[evaluation.fid]
enabled = true
every_successful_updates = "BENCHMARK_REQUIRED" # integer > 0
trend_samples = "BENCHMARK_REQUIRED" # integer > 0
acceptance_samples = 50000 # example only; benchmark may explicitly revise
feature_extractor = "REQUIRED_LOCKED_FEATURE_EXTRACTOR"
feature_extractor_version = "REQUIRED_LOCKED_VERSION"
preprocess_sha256 = "REQUIRED_IMMUTABLE_SHA256"
real_stats_sha256 = "REQUIRED_IMMUTABLE_SHA256"

[evaluation.is]
enabled = true
every_successful_updates = "BENCHMARK_REQUIRED" # integer > 0
trend_samples = "BENCHMARK_REQUIRED" # integer > 0
acceptance_samples = 50000 # example only; benchmark may explicitly revise
splits = "BENCHMARK_REQUIRED" # integer > 0
