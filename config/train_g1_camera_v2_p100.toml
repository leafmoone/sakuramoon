# HDM-style shifted-square camera viewport canary (p=1.0): every sample is
# evaluated for camera eligibility; applied samples train the full-canvas 2D
# RoPE on a stage-edge R x R square cut from the zoomed full long-axis
# canvas (short edge -> R, long axis fully preserved, equivalent zoom
# 1.10-1.50 from the natural source aspect, uniform inclusive shift).
# Ineligible samples (p does not force application) fall back to the
# ordinary aspect-bucket crop, so p=1.0 is a full-eligibility canary, not a
# full-application override.
#
# Data strategy change only -- model architecture, optimizer, LR, batch,
# objective and checkpoint schema are untouched. Extends the live G1 run
# config (bs800 / lr flat / seed 44) and overrides exactly:
#   - run identity and fully independent run/checkpoint/artifact paths
#   - [data.camera_viewport]: p=1.0, equivalent zoom 1.10-1.50
#
# First-version mutual exclusion: [data.spatial_crop] is disabled by the
# inherited live G1 config (p=0.0), so no override is needed here; enabling
# both camera_viewport and spatial_crop is rejected by the config validator.
#
# NOT deployed: the canary starts only after an explicit user GO; it then
# resumes from a COMPLETE production checkpoint via scripts/training_stack.sh
# (see AGENTS.md for the launch contract).

extends = ["train_g1.toml"]

[run]
run_id = "g1_camera_v2_p100"

[paths]
run_dir = "runs/g1_camera_v2_p100"
checkpoint_dir = "output_model/g1_camera_v2_p100"
artifact_dir = "artifacts/g1_camera_v2_p100"

[logging]
local_jsonl_path = "artifacts/g1_camera_v2_p100/metrics.jsonl"

[wandb]
retry_jsonl_path = "artifacts/g1_camera_v2_p100/wandb-retry.jsonl"

[evaluation]
output_dir = "output_model/evaluation/g1_camera_v2_p100"

[data.camera_viewport]
enabled = true
mode = "hdm_shifted_square_v2"
probability = 1.0
viewport = "stage_square"
min_equivalent_zoom = 1.10
max_equivalent_zoom = 1.50
offset_distribution = "uniform_long_axis_inclusive"
zoom_source = "natural_source_aspect"
fallback_to_aspect_bucket = true
