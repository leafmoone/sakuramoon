extends = ["base.toml"]

[run]
run_id = "h1-disabled"
intent = "template"
stage = "H1"
seed = "REQUIRED_H1_SEED"

[paths]
run_dir = "runs/h1"
checkpoint_dir = "checkpoints/h1"
artifact_dir = "artifacts/h1"

[distributed]
backend = "ddp"
world_size = 4
frozen_encoders_outside_wrapper = true
automatic_backend_fallback = false

[checkpoint]
slots = "BENCHMARK_H1_CHECKPOINT_SLOTS"

[growth]
enabled = false
alpha_schedule = "half_cosine"
alpha_fraction = 0.02
min_updates = 1000
max_updates = 5000
random_new_slots = true
copy_old_slots = false

[stage]
name = "H1"
enabled = false
predecessor = "S3"
world_size = 4
depth = 24
resolution = 768
local_batch = "BENCHMARK_H1_LOCAL_BATCH"
accumulation = "BENCHMARK_H1_ACCUMULATION"
global_batch = "BENCHMARK_H1_GLOBAL_BATCH"
activation_checkpoint_mode = "BENCHMARK_H1_ACTIVATION_CHECKPOINT_MODE"
planned_updates = "BENCHMARK_H1_PLANNED_UPDATES"
planned_valid_samples = "BENCHMARK_H1_PLANNED_VALID_SAMPLES"
planned_equivalent_data_passes = "BENCHMARK_H1_EQUIVALENT_DATA_PASSES"
planned_dit_flops = "BENCHMARK_H1_DIT_FLOPS"
planned_wall_time_hours = "BENCHMARK_H1_WALL_TIME_HOURS"
manual_finalize = true
automatic_transition = false

[logging]
local_jsonl_path = "artifacts/h1/metrics.jsonl"
flush_every_updates = "BENCHMARK_H1_METRICS_FLUSH_UPDATES"
async_remote = true
noise_observation_boundary = 0.95

[wandb]
retry_jsonl_path = "artifacts/h1/wandb-retry.jsonl"
