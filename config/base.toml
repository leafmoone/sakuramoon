
schema_version = 1

[run]
intent = "train"
seed = 44

[paths]
cache_dir = "cache/data"

[storage]
mode = "server_backed"
shared_filesystem = "nfs"
shared_mount_source = "cs1.vast1.bz1.paratera.com:/cs1/fs1/pvc-8eb5b2a2-c80d-4c40-b28a-800fbab13752"
nfs_version = 3
hard_mount = true
minimum_free_gib = 50
measured_raw_checkpoint_bytes = 5143061370
checkpoint_copies = 3
atomic_publish_probe = true

[security]
modelscope_token_env = "MODELSCOPE_API_TOKEN"
wandb_api_key_env = "WANDB_API_KEY"

[assets.qwen]
local_path = "model/qwen_3.5_2B"
dtype = "bfloat16"
frozen = true
layers = 24
hidden_size = 2048
use_cache = false
visual_path_enabled = false

[assets.vae]
local_path = "model/vae"
dtype = "bfloat16"
frozen = true
latent_channels = 128
downsample_factor = 16
sample_posterior = false

[data.source]
repo_id = "leafmoone/webdataset_danbooru_v2"
revision = "master"

[data.manifest]
path = "data/dataset-manifest-danbooru-v2.json"
initialize_if_missing = true
refresh_existing = false

[data.cache]
low_watermark_gib = "BENCHMARK_CACHE_LOW_WATERMARK_GIB"
high_watermark_gib = "BENCHMARK_CACHE_HIGH_WATERMARK_GIB"
download_concurrency = "BENCHMARK_DOWNLOAD_CONCURRENCY"
verified_shard_lookahead = "BENCHMARK_VERIFIED_SHARD_LOOKAHEAD"
persistent_workers_per_rank = "BENCHMARK_PERSISTENT_WORKERS_PER_RANK"
ready_batches_per_rank = "BENCHMARK_READY_BATCHES_PER_RANK"

[data.service]
socket_path = "/run/sakuramoon/data-service.sock"
ownership_lock_path = "/run/sakuramoon/data-service.lock"
mainset_path = "/root/private_data/sakuramoon/config/data-service-mainset.json"
request_timeout_seconds = "BENCHMARK_SERVICE_REQUEST_TIMEOUT_SECONDS"
lease_channel_capacity = "BENCHMARK_LEASE_CHANNEL_CAPACITY"
ack_channel_capacity = "BENCHMARK_ACK_CHANNEL_CAPACITY"

[data.transport]
connect_timeout_seconds = "BENCHMARK_CONNECT_TIMEOUT_SECONDS"
read_timeout_seconds = "BENCHMARK_READ_TIMEOUT_SECONDS"
max_retries = 3
retry_backoff_seconds = 1.0
stream_chunk_bytes = "BENCHMARK_STREAM_CHUNK_BYTES"
streams_per_shard = "BENCHMARK_STREAMS_PER_SHARD"

[data.loader]
pin_memory = true
drop_last = true
length_sort_window_batches = 2

[data.validation]
selection_path = "data/validation-cohorts/s0-validation-50k-v1/validation-selection.json"
shard_root = "data/validation-cohorts/s0-validation-50k-v1/shards"
shard_count = 7

[data.image]
exif_transpose = true
color_mode = "RGB"
no_upscale = true
preserve_aspect_ratio = true
allow_padding = false
min_crop_retention = 0.8

[data.buckets]
base_area_px = 262144
quantum_px = 32
min_short_edge_px = 256
max_aspect_ratio = 4.0
shape_count = 17
transpose_closed = true

[caption]
category_order = ["tags", "nl", "artist"]
tag_separator = ", "
tag_nl_separator = "\n\n"
text_condition_max = 512
condition_buckets = [64, 128, 192, 256, 320, 384, 448, 512]
qwen_dense_lengths = [98, 162, 226, 290, 354, 418, 482, 546]

[caption.dropout]
all_condition = 0.10
tag = 0.1
candidate_source = 0.3

[caption.dropout.nl]
long_names = 0.3
long_no_names = 0.3
short_vibes = 0.3
nl2 = 0.3
nl3 = 0.3

[model.text]
hidden_state_blocks = [2, 4, 8, 12, 16, 20, 24]
input_size = 2048
adapter_size = 1024
output_size = 2560
groups = 8
attention_heads = 16
bidirectional_attention_layers = 1
no_positional_encoding = true
norm_eps = 0.000001
mix_gate_init = 0.0
layer_scale_init = 1.0
projection_bias = false
linear_dtype = "bfloat16"
sensitive_dtype = "float32"

[model.style]
query_count = 4
input_size = 2048
hidden_size = 1024
mlp_intermediate_size = 2048
output_size = 2560
null_tokens_learned = true
attention_heads = 16
norm_eps = 0.000001
init_std = 0.02
projection_bias = false
linear_dtype = "bfloat16"
sensitive_dtype = "float32"

[model.packing]
order = ["text", "style", "image"]
style_tokens = 4
remove_text_padding = true
cross_sample_attention = false
modality_init_std = 0.02

[model.rope]
head_dim = 128
nope_dim = 32
y_dim = 48
x_dim = 48
position_scale = 16.0
theta = 1000.0
cell_center = true
area_normalized = true

[model.dit]
hidden_size = 2560
head_dim = 128
q_heads = 20
kv_heads = 5
intermediate_size = 6912
stable_slot_count = 24
patch_size = 1
attention_dropout = 0.0
mlp_dropout = 0.0
projection_bias = false
norm_eps = 0.000001
norm_accumulation = "float32"
activation_dtype = "bfloat16"

[model.condition]
timestep_dim = 256
size_dim = 64
aspect_dim = 64
input_dim = 384
hidden_dim = 1024
block_modulation_chunks = 6
shared_projection_zero_init = true
per_block_bias_zero_init = true

[model.head]
final_modulation_size = 5120
out_channels = 128
prediction_type = "x"
image_span_only = true
weight_zero_init = true
bias_zero_init = true

[objective]
prediction_type = "x"
loss = "jlt_x_prediction_velocity_mse"
target_velocity = "x_to_v(clean,state,t,t_eps)"
endpoint_weighting = "inverse_square_clamped"
interpolation = "z_t=t*x+(1-t)*epsilon"
velocity_loss_dtype = "float32"
reduction = "per_sample_then_global_sample_mean"

[timestep]
distribution = "jlt"
p_mean = -0.8
p_std = 0.8
noise_scale = 1.0
t_eps = 0.05

[sampling]
profile = "balanced"
state_dtype = "float32"

[sampling.training]
enabled = true
every_updates = 1000
image_count = 5
output_subdir = "sample"

[sampling.profiles.preview]
solver = "euler"
steps = 28
time_schedule = "linear"

[sampling.profiles.balanced]
solver = "heun_final_euler"
steps = 25
time_schedule = "linear"

[sampling.profiles.reference]
solver = "heun_final_euler"
steps = 50
time_schedule = "linear"

[cfg]
scale = 2.9
full_interval = true
rescale = false
conversion_order = "each_x_to_v_then_cfg"

[optimizer]
name = "torchao_adamw8bit"
# JLT-style scaling: actual_lr = base_lr * stage.global_batch / reference_batch.
base_lr = 0.00005
reference_batch = 256
lr_scaling = "linear_global_batch"
betas = [0.9, 0.95]
eps = 0.00000001
block_size = 256
bf16_stochastic_round = true
matrix_weight_decay = 0.0
sensitive_weight_decay = 0.0

[scheduler]
name = "linear_warmup_constant"
warmup_updates = 1000
after_warmup = "constant"

[gradient]
clip_norm = 1.0
clip_dtype = "float32"
global_sample_mean = true

[checkpoint]
kind = "raw"
full_every_updates = 1000
atomic_complete_marker = true
canonical_fqn = true

[kernels]
attention_backend = "das_fa2_varlen"
qwen_attention_backend = "flash_attention_2"
tunableop_enabled = false
tunableop_tuning = false
tunableop_record_untuned = false
tunableop_max_tuning_duration_ms = 50
torch_compile_enabled = false
torch_compile_backend = "inductor"
torch_compile_mode = "default"
torch_compile_dynamic = false
dtype = "bfloat16"
native_gqa = true
repeat_kv_heads = false
silent_fallback = false

[failure]
stop_on_nonfinite = true
stop_on_oom = true
stop_on_rank_divergence = true
allow_force_bypass = false
automatic_batch_change = false
automatic_backend_change = false

[logging]
observer_queue_capacity = "BENCHMARK_METRIC_OBSERVER_QUEUE_CAPACITY"
observer_event_timeout_seconds = "BENCHMARK_METRIC_EVENT_TIMEOUT_SECONDS"

[wandb]
enabled = false
project = "sakuramoon"
entity = "2574905817leaf-jinan-university"
offline_on_network_error = true
queue_capacity = "BENCHMARK_WANDB_QUEUE_CAPACITY"
replay_retry_on_start = true
finish_on_close = true
resume_policy = "allow"

[timing]
enabled = true
cuda_events = true
force_synchronize_each_phase = false
phases = [
  "data", "qwen", "vae", "conditioning", "dit_forward", "loss",
  "backward", "ddp", "clip", "optimizer", "checkpoint", "evaluation",
  "cache", "tar", "json", "caption", "tokenize", "decode", "exif",
  "crop", "bucket", "h2d", "condition", "zero_grad", "sample",
]

[evaluation]
enabled = false
