schema_version = 1

[evidence]
classification = "synthetic_single_gpu_engineering_only"
formal_s000 = false
production_cli_unlock = false
production_capacity_claim = false
production_quality_claim = false

[run]
run_id = "s000-engineering-smoke-20260802-v2"
seed = 8062
optimizer_sr_seed = 8063
output_root = "artifacts/engineering-smoke/s000-20260802-v2"
dependency_lock_path = "uv.lock"
initial_successful_updates = 1
fresh_process_next_updates = 1

[device]
kind = "cuda"
index = 0
visible_device_count = 1
world_size = 1

[service]
socket_path = "/run/sakuramoon/engineering-smoke-s000.sock"
ownership_lock_path = "/run/sakuramoon/engineering-smoke-s000.lock"
request_timeout_seconds = 30.0
startup_timeout_seconds = 30.0
shutdown_timeout_seconds = 30.0
fresh_process_timeout_seconds = 900.0
download_concurrency = 2
verified_shard_lookahead = 2
lease_channel_capacity = 2
ack_channel_capacity = 2

[assets.qwen]
local_path = "model/qwen_3.5_2B"
dtype = "bfloat16"
frozen = true
layers = 24
hidden_size = 2048
use_cache = false
visual_path_enabled = false

[assets.vae]
local_path = "model/vae"
dtype = "bfloat16"
frozen = true
latent_channels = 128
downsample_factor = 16
sample_posterior = false

[data]
source_kind = "generated_local_tar"
source_width = 640
source_height = 512
shard_count = 4
samples_per_shard = 1
validation_sample_count = 2000
persistent_workers = 2
ready_batches = 2
local_batch = 1
pass_index = 0
pin_memory = true
drop_last = true
cache_low_bytes = 0
cache_high_bytes = 67108864
transport_chunk_bytes = 4096
base_area_px = 262144
quantum_px = 32
min_short_edge_px = 256
max_aspect_ratio = 4.0
shape_count = 17
transpose_closed = true
exif_transpose = true
color_mode = "RGB"
no_upscale = true
preserve_aspect_ratio = true
allow_padding = false
min_crop_retention = 0.8

[caption]
category_order = ["nsfw", "character", "copyright", "general", "nl"]
tag_separator = ", "
tag_nl_separator = "\n\n"
text_condition_max = 512
condition_buckets = [64, 128, 192, 256, 320, 384, 448, 512]
qwen_dense_lengths = [98, 162, 226, 290, 354, 418, 482, 546]

[caption.dropout]
all_condition = 0.10
general = 0.1
artist = 0.1
character = 0.2
copyright = 0.1
nsfw = 0.1
candidate_source = 0.3

[caption.dropout.nl]
long_names = 0.3
long_no_names = 0.3
short_vibes = 0.3
nl2 = 0.3
nl3 = 0.3

[model.text]
hidden_state_blocks = [2, 4, 8, 12, 16, 20, 24]
input_size = 2048
adapter_size = 1024
output_size = 2560
groups = 8
attention_heads = 16
bidirectional_attention_layers = 1
no_positional_encoding = true
norm_eps = 0.000001
mix_gate_init = 0.0
layer_scale_init = 1.0
projection_bias = false
linear_dtype = "bfloat16"
sensitive_dtype = "float32"

[model.style]
query_count = 4
input_size = 2048
hidden_size = 1024
mlp_intermediate_size = 2048
output_size = 2560
null_tokens_learned = true
attention_heads = 16
norm_eps = 0.000001
init_std = 0.02
projection_bias = false
linear_dtype = "bfloat16"
sensitive_dtype = "float32"

[model.packing]
order = ["text", "style", "image"]
style_tokens = 4
remove_text_padding = true
cross_sample_attention = false
modality_init_std = 0.02

[model.rope]
head_dim = 128
nope_dim = 32
y_dim = 48
x_dim = 48
position_scale = 16.0
theta = 1000.0
cell_center = true
area_normalized = true

[model.dit]
hidden_size = 2560
head_dim = 128
q_heads = 20
kv_heads = 5
intermediate_size = 6912
stable_slot_count = 24
patch_size = 1
attention_dropout = 0.0
mlp_dropout = 0.0
projection_bias = false
norm_eps = 0.000001
norm_accumulation = "float32"
activation_dtype = "bfloat16"

[model.condition]
timestep_dim = 256
size_dim = 64
aspect_dim = 64
input_dim = 384
hidden_dim = 1024
block_modulation_chunks = 6
shared_projection_zero_init = true
per_block_bias_zero_init = true

[model.head]
final_modulation_size = 5120
out_channels = 128
prediction_type = "x"
image_span_only = true
weight_zero_init = true
bias_zero_init = true

[objective]
prediction_type = "x"
loss = "jlt_x_prediction_velocity_mse"
target_velocity = "x_to_v(clean,state,t,t_eps)"
endpoint_weighting = "inverse_square_clamped"
interpolation = "z_t=t*x+(1-t)*epsilon"
velocity_loss_dtype = "float32"
reduction = "per_sample_then_global_sample_mean"

[timestep]
distribution = "jlt"
p_mean = -0.8
p_std = 0.8
noise_scale = 1.0
t_eps = 0.05

[optimizer]
name = "torchao_adamw8bit"
lr = 0.00002
betas = [0.9, 0.95]
eps = 0.00000001
block_size = 256
bf16_stochastic_round = true
matrix_weight_decay = 0.01
sensitive_weight_decay = 0.0

[gradient]
clip_norm = 1.0
clip_dtype = "float32"
global_sample_mean = true

[distributed]
backend = "native"
world_size = 1
frozen_encoders_outside_wrapper = true
automatic_backend_fallback = false

[checkpoint]
kind = "raw"
slots = 3
full_every_updates = 1000
full_every_hours = 6.0
atomic_complete_marker = true
checksum_required = true
canonical_fqn = true

[growth]
enabled = false
alpha_schedule = "half_cosine"
alpha_fraction = 0.02
min_updates = 1000
max_updates = 5000
random_new_slots = true
copy_old_slots = false

[stage]
name = "S0"
depth = 16
resolution = 256
local_batch = 1
accumulation = 1
successful_updates = 2
activation_checkpoint_mode = "none"
growth_alpha = 1.0

[measurement]
noise_observation_boundary = 0.95

[kernels]
attention_backend = "dense_sdpa_reference"
production_attention_backend = "fa4_varlen"
reference_attention_backend = "dense_sdpa_reference"
dtype = "bfloat16"
native_gqa = true
repeat_kv_heads = false
silent_fallback = false

[failure]
stop_on_nonfinite = true
stop_on_oom = true
stop_on_rank_divergence = true
allow_force_bypass = false
automatic_batch_change = false
automatic_backend_change = false
