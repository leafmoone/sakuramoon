# shifted_bucket_v1 full-probability config: 50% of samples train the
# full-canvas 2D RoPE zoom/shift on a larger canvas cropped back to the
# aspect bucket.
#
# Data strategy change only -- model architecture is untouched. Extends the
# live G1 run config (bs800 / lr flat / seed 44) and overrides exactly:
#   - run identity and fully independent run/checkpoint/artifact paths
#   - [data.spatial_crop]: p=0.50, equivalent zoom 1.02-1.10
#   - [stage].automatic_transition kept false (manual finalize only)
#
# Deploy only after the p25 canary (2000 successful updates) passes every
# gate; then resume from the latest COMPLETE p25 checkpoint via
# scripts/training_stack.sh.

extends = ["train_g1.toml"]

[run]
run_id = "g1_spatial_p50"

[paths]
run_dir = "runs/g1_spatial_p50"
checkpoint_dir = "output_model/g1_spatial_p50"
artifact_dir = "artifacts/g1_spatial_p50"

[logging]
local_jsonl_path = "artifacts/g1_spatial_p50/metrics.jsonl"

[wandb]
retry_jsonl_path = "artifacts/g1_spatial_p50/wandb-retry.jsonl"

[evaluation]
output_dir = "output_model/evaluation/g1_spatial_p50"

[stage]
automatic_transition = false

[data.spatial_crop]
enabled = true
mode = "shifted_bucket"
probability = 0.5
min_equivalent_zoom = 1.02
max_equivalent_zoom = 1.10
zoom_distribution = "sqrt_uniform_high"
offset_distribution = "uniform_independent"
fallback_to_aspect_bucket = true
