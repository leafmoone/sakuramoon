# transparent_background white-composite canary: a sample whose general tag
# semantically matches transparent_background and carries a usable per-pixel
# alpha is composited onto a solid white canvas BEFORE resize/crop, its trigger
# tag is rewritten to white_background (serialized "white background"), and
# every training NL candidate is cleared (sample-level NL off). Missing alpha,
# special alpha effects, and conflicting explicit backgrounds are rejected and
# counted; rejected samples never reach Qwen/VAE/DiT.
#
# Data-strategy change for model/loss/growth/budget -- they are untouched, and
# the shifted_bucket spatial crop stays OFF (inherited from base.toml, where it
# is disabled). Extends the live G1 run config and overrides exactly:
#   - run identity and fully independent run/checkpoint/artifact paths
#   - [stage]: local_batch 19 / accum 20 -> global 760 (world 2), automatic_transition false
#   - [optimizer]: base_lr anchored to the live canary value (see section 17)
#   - [data.transparent_background]: enabled + reject sets
#
# Canary deploy (section 18) resumes from the latest COMPLETE checkpoint at
# deploy time (PRE_TRANSPARENT_POLICY) via scripts/training_stack.sh; run
# 500-1000 updates (section 19) with the hard gates before promotion.

extends = ["train_g1.toml"]

[run]
run_id = "g1_transparent_white"

[paths]
run_dir = "runs/g1_transparent_white"
checkpoint_dir = "output_model/g1_transparent_white"
artifact_dir = "artifacts/g1_transparent_white"

[logging]
local_jsonl_path = "artifacts/g1_transparent_white/metrics.jsonl"

[wandb]
retry_jsonl_path = "artifacts/g1_transparent_white/wandb-retry.jsonl"

[evaluation]
output_dir = "output_model/evaluation/g1_transparent_white"

# §17 canary batch shape: 19 * 20 * 2 = 760 global. The transparent canary
# anchors base_lr to the live p50 canary's 0.0000475 value (NOT the
# train_g1.toml S0 0.00005 anchor) so the actual learning rate tracks the
# live run's JLT scaling at whatever global batch the canary runs in:
#   - 2-dcu canary:  0.0000475 * 760 / 256 = 0.000141015625
#   - 1-dcu canary:  0.0000475 * 400 / 256 = 0.00007421875 (the live p50 rate)
# Growth/budget inherit unchanged from train_g1.toml (half-cosine growth,
# planned_updates 168000 = absolute successful-update terminal). The
# preflight "resume_contract" check verifies at
# cutover that the source checkpoint's saved optimizer learning rate equals
# this configured rate exactly (no tolerance); any drift fails the run.
[stage]
local_batch = 19
accumulation = 20
global_batch = 760
automatic_transition = false

# Live-canary LR anchor: keep the per-sample step on the p50 canary's value
# across the transparent cut-over (see the section 17 note above).
[optimizer]
base_lr = 0.0000475

# §5 strict config. base.toml supplies the defaults; the canary turns the
# policy on and fixes the reject sets. trigger/replacement/composite are spelled
# out explicitly (they equal the base.toml defaults) so the canary is
# self-documenting regardless of TOML merge depth.
[data.transparent_background]
enabled = true
trigger_tag = "transparent_background"
replacement_tag = "white_background"
composite_color = "white"
# Special alpha effects: the image's alpha is unreliable, compositing would be
# wrong -> strict reject + count (section 4).
special_alpha_tags = ["alpha_transparency", "thumbnail_surprise"]
# Conflicting explicit background: a transparent tag co-occurring with an
# explicit background tag is a data error -> strict reject + count (section 4).
conflict_background_tags = [
    "white_background",
    "black_background",
    "blue_background",
    "green_background",
    "pink_background",
    "grey_background",
]
