extends = ["train_s0.toml"]

[run]
run_id = "s0-engineering-capacity-w2-b1"

[paths]
run_dir = "runs/s0-engineering-capacity/w2-b1"
checkpoint_dir = "checkpoints/s0-engineering-capacity/w2-b1"
artifact_dir = "artifacts/s0-engineering-capacity/w2-b1"

[data.cache]
low_watermark_gib = 32
high_watermark_gib = 64
download_concurrency = 2
verified_shard_lookahead = 3
persistent_workers_per_rank = 2
ready_batches_per_rank = 2

[data.service]
mainset_path = "cache/data-service-capacity/w2-mainset.json"
request_timeout_seconds = 30.0
lease_channel_capacity = 2
ack_channel_capacity = 2

[data.transport]
connect_timeout_seconds = 10.0
read_timeout_seconds = 30.0
stream_chunk_bytes = 1048576

[checkpoint]
full_every_updates = 1

[stage]
local_batch = 1
accumulation = 4
global_batch = 4
planned_updates = 1

[kernels]
attention_backend = "dense_sdpa_reference"

[logging]
local_jsonl_path = "artifacts/s0-engineering-capacity/w2-b1/metrics.jsonl"
observer_queue_capacity = 64
observer_event_timeout_seconds = 30.0

[wandb]
retry_jsonl_path = "artifacts/s0-engineering-capacity/w2-b1/wandb-retry.jsonl"
queue_capacity = 64
