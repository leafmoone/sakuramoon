extends = ["base.toml"]

[sampling.training]
# G1 ramp is complete: 60-image sample every 200 updates is over-observation on
# the critical path (rank0 sample -> publish -> telemetry -> evaluation ->
# progress.synchronize -> training continues). Lowered to every 1000 updates to
# recover wall-clock samples/day. The 5000-update evaluation stays as the fixed
# concept probe; the full concept benchmark runs at 10000 (see 120-concept suite).
enabled = true
every_updates = 1000
image_count = 60
output_subdir = "sample"
fixed_cohort = "locked"
longitudinal_pin_update = 62000

[run]
run_id = "g1_256_bs760"
stage = "G1"
seed = 44

[paths]
run_dir = "runs/g1"
checkpoint_dir = "output_model/g1"
artifact_dir = "artifacts/g1"

[distributed]
backend = "accelerate"
world_size = 2
frozen_encoders_outside_wrapper = true
automatic_backend_fallback = false

[checkpoint]
full_every_updates = 100
slots = 2

[data.cache]
low_watermark_gib = 192
high_watermark_gib = 256
download_concurrency = 8
verified_shard_lookahead = 48
persistent_workers_per_rank = 8
ready_batches_per_rank = 8

[data.service]
request_timeout_seconds = 30.0
lease_channel_capacity = 24
ack_channel_capacity = 24

[data.transport]
connect_timeout_seconds = 10.0
read_timeout_seconds = 30.0
stream_chunk_bytes = 1048576
streams_per_shard = 4

[growth]
enabled = true
alpha_schedule = "half_cosine"
alpha_fraction = 0.02
min_updates = 1000
max_updates = 5000
random_new_slots = true
copy_old_slots = false

[kernels]
torch_compile_enabled = true
torch_compile_dynamic = true
# src A/B bench (2026-08-22, resume 61900, steady 30 updates each):
# default mode 16.47 s/update vs max-autotune-no-cudagraphs 15.67 s/update (-4.9%,
# gain in backward 8.09->7.26 s; autotune keeps fp32 accumulation, no TF32).
# window=4/8 and vae_torch_compile measured non-beneficial / unsupported on DTK.
torch_compile_mode = "max-autotune-no-cudagraphs"

[optimizer]
# No base_lr override: inherit the S0-tuned base_lr=0.00005 from base.toml and
# let the JLT rule auto-scale the actual LR with the configured global batch
# (0.00005 * 800 / 256 = 0.00015625 here). base_lr is a config anchor that a
# future run may re-tune; it is never a mechanism that pins the actual LR.
# (base.toml provides the remaining optimizer fields via deep merge.)

[stage]
name = "G1"
enabled = true
predecessor = "S0"
world_size = 2
depth = 20
resolution = 256
local_batch = 20
accumulation = 20
# global_batch=800 with base_lr=0.00005 inherited from base.toml (see
# [optimizer]) -> actual_lr=0.00015625 (JLT auto-scaled, reference_batch=256).
global_batch = 800
activation_checkpoint_mode = "none"
planned_updates = 110000
manual_finalize = true
automatic_transition = false

[logging]
local_jsonl_path = "artifacts/g1/metrics.jsonl"
flush_every_updates = 1
async_remote = true
noise_observation_boundary = 0.95
observer_queue_capacity = 64
observer_event_timeout_seconds = 30.0

[wandb]
enabled = true
retry_jsonl_path = "artifacts/g1/wandb-retry.jsonl"
queue_capacity = 64
# Keep the remote run open after clean closes: every restart re-attaches to
# the same fixed run id (g1_256_bs760) via resume="allow" instead of minting
# a new remote run. Finish the run manually (wandb UI/API) only when this
# training run is truly final.
finish_on_close = false

[evaluation]
enabled = true
every_updates = 5000
sample_count = 1000
real_sample_count = 34849
batch_size = 64
is_splits = 10
kid_subsets = 100
kid_subset_size = 1000
prompt_path = "data/validation-cohorts/s0-validation-50k-v1/validation-prompts.json"
validation_shard_root = "data/validation-cohorts/s0-validation-50k-v1/shards"
output_dir = "output_model/evaluation/g1"
sampling_profile = "preview"
concept_suite_enabled = true
concept_suite_manifest = "data/concept-benchmarks/concept-120-v1/manifest-120-v1-refs341b.json"
concept_suite_refs_root = "concept-refs/concept-120-v1"
