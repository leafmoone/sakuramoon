extends = ["engineering_capacity_s000.toml"]

[run]
run_id = "s0-engineering-eval-bounded"
intent = "eval"

[paths]
run_dir = "runs/s0-engineering-eval-bounded"
checkpoint_dir = "checkpoints/s0-engineering-eval-bounded"
artifact_dir = "artifacts/s0-engineering-eval-bounded"

[sampling]
profile = "reference"

[logging]
local_jsonl_path = "artifacts/s0-engineering-eval-bounded/metrics.jsonl"

[wandb]
retry_jsonl_path = "artifacts/s0-engineering-eval-bounded/wandb-retry.jsonl"

[evaluation]
enabled = true
stage_end = true
explicit_job = true
gpu_index = 0
training_paused = true
batch_size = 1
output_reserve_gib = 1

[evaluation.sampling]
profile = "reference"

[evaluation.extractor]
enabled = false

[evaluation.fid]
enabled = false

[evaluation.is]
enabled = false

[evaluation.manual_quality]
enabled = true
samples = 2
