[project]
name = "sakuramoon"
version = "0.0.0"
description = "Training infrastructure for the SakuraMoon text-to-image model"
readme = "README.md"
requires-python = ">=3.11,<3.13"
# Install the appropriate torch build for the hardware before using --no-sync.
# The base environment supports inference without training or vendor kernels.
dependencies = [
    "torch>=2.9,<2.14",
    "transformers>=5.14.1,<5.15",
    "safetensors>=0.8,<0.9",
    "pillow>=11,<13",
    "pydantic>=2.12.5,<3",
    "tomli-w>=1.2,<2",
]

[project.optional-dependencies]
train = [
    "accelerate>=1.13,<2",
    "duckdb>=1.5,<2",
    "einops>=0.8.2,<0.9",
    "modelscope>=1.39,<2",
    "modelscope-hub>=0.1.8,<0.2",
    "pyarrow>=25,<26",
    "sentry-sdk>=2.66,<3",
    "torchao>=0.16,<0.17",
    "wandb>=0.28,<0.29",
    "webdataset>=1.0.2,<2",
]
eval = [
    "accelerate>=1.13,<2",
    "diffusers>=0.39,<0.40",
    "lpips>=0.1.4,<0.2",
    "pytorch-fid>=0.3,<0.4",
    "pytorch-msssim>=1.0,<2",
    "timm>=1.0.16,<2",
    "torchvision>=0.24,<0.29",
]
# DTK users must obtain FLA and FlashAttention from their hardware vendor.
# These optional CUDA accelerators are not needed by the SDPA inference path.
cuda-fast = [
    "flash-linear-attention[cuda]>=0.5.2,<0.6",
]
data-tools = [
    "numpy>=1.26,<3",
    "onnxruntime>=1.20,<2",
]

[dependency-groups]
dev = [
    "markdown-it-py~=4.2.0",
    "pyright[nodejs]~=1.1.411",
    "pytest~=9.1.1",
    "ruff~=0.16.0",
]

[tool.uv]
package = false
cache-dir = "cache/uv"
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.pyright]
include = ["src/sakuramoon", "tests"]
exclude = [
    "**/.ipynb_checkpoints",
    "**/__pycache__",
    ".venv",
    "artifacts",
    "cache",
    "output_model",
    "data",
    "db",
    "diagnostics",
    "model",
    "outputs",
    "profile",
    "profiles",
    "reference",
    "runs",
    "samples",
    "traces",
    "wandb",
    # Vendored untyped third-party source (Meta PE vision encoder,
    # Apache-2.0; see src/sakuramoon/pe_spatial/NOTICE).  Checked by ruff;
    # excluded from strict pyright to keep the diagnostic baseline clean.
    "src/sakuramoon/pe_spatial/rope.py",
    "src/sakuramoon/pe_spatial/pe_vision.py",
    "src/sakuramoon/pe_spatial/config.py",
]
extraPaths = ["src"]
# Use the selected interpreter (or pyright --pythonpath), including vendor
# environments with system-site-packages; do not assume a repository .venv.
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Verbatim vendored third-party source (Meta PE, Apache-2.0): upstream
# style kept as-is; see src/sakuramoon/pe_spatial/NOTICE.
"src/sakuramoon/pe_spatial/rope.py" = [
    "F401",
    "PYI030",
    "UP007",
    "UP045",
]
"src/sakuramoon/pe_spatial/pe_vision.py" = [
    "PLR0402",
    "RUF013",
    "RUF059",
    "SIM102",
    "SIM201",
    "UP008",
    "UP035",
    "UP045",
]
"src/sakuramoon/pe_spatial/config.py" = ["RUF013"]
