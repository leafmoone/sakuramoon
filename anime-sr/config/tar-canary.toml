# Tar-direct canary (2026-09-01): the short end-to-end run over the
# streaming data plane. Overlay on base + data + smoke; the run is
# ~200 steps (3200 exposures at bs 8 x world 2) — just long enough to
# exercise the window driver (pin / release / epoch edge), the in-tar
# decode path and the resume-free canary contract. NOT a model canary:
# the M3 structure checklist runs in its own smoke run; this one only
# proves the tar-direct DATA PATH is training-safe.

[phase1]
exposure_target = 3200
exposure_min = 1000
exposure_max = 10000

[sampling]
# The M4-1024-frozen pool sampler is a FULL-SET permutation per cycle:
# any 300-step window touches ~all 986 SR_v2 shards (~806 GB resident
# working set), which defeats bounded streaming on any single node.
# The canary therefore uses the legacy straight-read stream (index
# order): the window touches ~2-4 shards per 300 steps. Stream semantics
# for the SR_v2 6M run is an open venue decision (see 2026-09-01
# report) — this overlay only scopes the canary.
enabled = false

[latent_flow]
# SR_v2 has no precomputed latent store: z_hr comes from the on-the-fly
# VAE encode (P1 ④). producer=process + depth 4 mirror the M4-1024
# verified combination and exercise the pre-NCCL fork wedge fix.
zhr_source = "onfly"
producer = "process"
prefetch_depth = 4
