# M1 data contract (plan §10, §11). See docs/data-contract.md + degradation-v1.md.

[data]
# raw source continues from the existing Danbooru WebDataset dataset (plan §10.1)
raw_source = "danbooru-webdataset"
manifest_dir = "data/index"
outputs = [
  "sr-eligibility-v1.parquet",
  "shard-summary-v1.parquet",
  "filter-report-v1.json",
  "sr-validation-v1.json",
]

[filter]
# §10.4 hard exclusions; 35% of hard-excluded samples are human-reviewed
# (quality-gated) before they are dropped.
hard_exclude = ["nsfw", "gore", "blood", "logo", "watermark", "signature", "text-heavy-ui"]
human_review_fraction = 0.35
# danbooru quality tiers for the priority pool (top 3 of 7; "good" is normal):
# masterpiece / best / great
priority_quality = ["masterpiece", "best", "great"]
# priority pool also requires these danbooru meta field values (plan §10.4:
# polished / illustration / bangumi / comic)
priority_completeness = ["polished"]
priority_classification = ["illustration", "bangumi", "comic"]
# aux pool: danbooru completeness / classification fields (was tag heuristic)
aux_completeness = ["monochrome", "rough"]
aux_classification = ["3d"]
# LEGACY quota knob — INACTIVE for M4-1024 (diversity-first full-set
# permutation: the per-cycle allocation always resolves to the natural pool
# membership, so this cap never binds; kept for schema back-compat).
aux_max_fraction = 0.20
# classifications hard-rejected (plan §10.4: not_painting)
hard_classifications = ["not_painting"]
# crops must retain >= 80% of a subject to be kept
crop_retention_min = 0.80
# clean-score (P1-4, 2026-08-29): FROZEN offline sidecar, precomputed by
# `python -m anime_sr.cli.clean_score_precompute` (single writer,
# incremental). Training loads it read-only: distribution report at start-up
# + optional gate. No compute/append at training time (the legacy lazy
# multi-rank O_APPEND race is gone).
clean_score_stage = "lazy"
clean_score_cache = true
# training gate: HR with score below this is excluded from the paired set
# (fail-closed: no sidecar row = excluded). -1.0 = disabled / REPORT-ONLY:
# read the start-up distribution report first, then pick the threshold.
clean_score_min = -1.0
# thresholds the report simulates (kept/excluded counts)
clean_score_candidates = [0.5, 0.6, 0.7]

[sampling]
# P1 pool sampler (M4-prep 2026-08-29; M4-1024 semantics frozen 2026-08-31):
# DIVERSITY-FIRST FULL-SET DETERMINISTIC PERMUTATION — every eligible sample
# exactly once per cycle, so the train stream's pool composition equals the
# data's NATURAL composition (for M4-1024 ~19/60/21; accepted as a data
# statistic, no 80/10/10 quota, no index re-labeling). enabled=false
# restores the legacy straight-read stream (index/store order) bit-for-bit.
# NOTE: core/regular/aux_fraction below are LEGACY QUOTA KNOBS and are
# INACTIVE for M4-1024 — the per-cycle allocation always resolves to the
# natural pool membership, so these values do not change the emitted
# stream (kept for schema back-compat; do not read as achieved shares).
enabled = true
core_fraction = 0.80
regular_fraction = 0.10
aux_fraction = 0.10

[validation]
# §16.1: synthetic pairs 5000 (1000 per degradation profile), stress 500,
# real LQ min 200 / target 500. Zero overlap with training.
synthetic_pairs = 5000
stress_set = 500
real_lq_min = 200
real_lq_target = 500
zero_overlap = true

[degradation]
# §11.1 profile sampling weights (P0 still applies 4x downsample, no extra damage)
profiles = { P0_clean = 0.10, P1_mild_web = 0.25, P2_normal_web = 0.35, P3_anime_codec = 0.20, P4_severe = 0.10 }
# §11.2 initial ranges (mild / normal / severe)
blur_sigma = { mild = [0.1, 0.6], normal = [0.2, 1.2], severe = [0.5, 2.0] }
# sinc low-pass cutoff fc (cycles/px, Nyquist=0.5); lower = stronger blur.
# Independent of blur_sigma (P1-fix 2026-08-29, M4-prep work order).
sinc_fc = { mild = [0.10, 0.30], normal = [0.08, 0.25], severe = [0.05, 0.20] }
gaussian_noise = { mild = [0.0, 2.0], normal = [0.0, 5.0], severe = [2.0, 10.0] }
jpeg_quality = { mild = [80, 98], normal = [55, 90], severe = [30, 70] }
# §11.3 offline codec bank: 50k-100k HR crops, 1-2 codec versions per crop,
# feeds 10-20% of online batches
codec_bank_hr_crops_min = 50000
codec_bank_hr_crops_max = 100000
codec_bank_versions_per_crop = [1, 2]
codec_bank_batch_fraction = [0.10, 0.20]
# deterministic seed (plan §11.5): H(global_seed, sample_id, data_cycle, exposure_index)
seed = "H(global_seed, sample_id, data_cycle, exposure_index)"
# final LQ size must be exactly HR/4
output_size = "hr/4 exact"
