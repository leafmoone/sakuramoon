# SR_v2 6M (2026-09-01, venue salt9): the M4-1024 stage on the SR_v2 corpus
# (leafmoone/SR_v2, 986 shards / 2,188,067 train-eligible images, 100%
# eligible single pool, train-only — the held-out val probe is a no-op by
# construction, in-stream val samples from the train index).
#
#   base.toml + data.toml + sr_v2_6m.toml                -> SR_v2 6M (this run)
#   base.toml + data.toml + sr_v2_6m.toml
#       + tar-canary.toml (exposure only)                -> the 200-step data
#                                                           canary already ran
#
# Identical to the frozen M4-1024 stage (model 122.67M trunk +
# PixelConditionEncoder, 256->1024, onfly z_hr, process producer, frozen
# optimizer/schedule/EMA, 6M exposure budget) EXCEPT:
#   * stream: sampling.strategy = "shard_seq" (2026-09-01 venue decision:
#     per-cycle permutation OF TARS + intra-tar sequential streaming — the
#     M4 pool sampler's full-set permutation is incompatible with bounded
#     tar-direct streaming; see docs/tar-canary notes)
#   * out_dir: the salt9 venue pins checkpoints on LOCAL disk (the CLI
#     --out-dir overrides to /root/srv2-run/output/sr-v2-6m; NFS is the
#     50G-quota persistence layer and never holds GB-scale run outputs)
#   * wandb enabled (2026-09-01): the key was file-channeled from salt7 to
#     /root/private_data/anime-sr/sr-ds/.env.wandb (0600) and sourced by the
#     venue watchdog; the ModelScope hub mirror (checkpoints/sr/) is fed by
#     the sr_hub_publisher sidecar — train-state every 100 steps + every
#     checkpoint on the save grid (survives pod rebuilds)
#
# Starting state (2026-09-01, user decision pending): the frozen M4-1024
# --stage-transition source (Phase I-P latest.pt, sha256 9c22a6d8…) is
# lost with the salt8 host and was never published. The hub keeps
# checkpoints/latent-flow-phase1-small/step-0005000.pt (120.49M full
# U-Flow trunk, Phase I val milestone) — the --init-trunk path (trained
# trunk, pixel stage zero-init) is the semantically correct use of it.

[phase1]
# Fixed first-stage budget (min=max pins it; extending requires editing
# this file as an explicit decision, which the run end-judgement owns).
exposure_target = 6000000
exposure_min = 6000000
exposure_max = 6000000
final_256_extra_exposures = 0

# 100% 256 LQ -> 1024 HR (the single production resolution, M4-1024).
[[phase1.curriculum]]
label = "SR_v2-1024"
fraction = 1.0
mix = { "256" = 1.0 }

[optimizer]
# Frozen Phase-I optimizer (carried into the long stage; the fresh
# scheduler below re-anchors the LR: step 0 starts the warmup — weights
# continue, long-stage scheduler starts fresh).
name = "adamw"
lr = 0.00015
betas = [0.9, 0.95]
eps = 1e-8
weight_decay = 0.05
no_decay = ["norm", "bias", "layerscale", "position", "gates"]

[scheduler]
# Fresh long-stage schedule over the 6M horizon (375,000 optimizer steps
# at global batch 16): 3% warmup from step 0, cosine to 10% floor.
warmup_fraction = 0.03
type = "cosine"
min_lr_ratio = 0.10

[gradient]
clip_norm = 1.0

[ema]
# plan §14.3 / U233 P2-1: half-life in GLOBAL exposures (one step feeds
# bs x world_size = 16 samples); retention is exactly 1/2 at 500k.
half_life_samples = 500000

[latent_flow]
batch_size = 8
pixel_features = true
zhr_source = "onfly"
producer = "process"
prefetch_depth = 4
out_dir = "output_model/latent-flow-sr-v2-6m"
# Production v2 checkpoints: every 250k GLOBAL exposures (worst-case
# training loss <= 250k exposures on a ~3-day run at salt9 canary
# throughput) PLUS the major milestones 100k/250k/500k/1M/2M/4M
# (+ run-end latest.pt at 6M). 250000 / global-batch-16 = 15625 steps.
# 24 periodic x ~1.23 GiB ~= 30 GiB on the LOCAL venue disk (verified:
# 543 GiB free at launch).
save_every_steps = 15625
save_at_exposures = [100000, 250000, 500000, 1000000, 2000000, 4000000]
# Held-out probe grid (no-op on this train-only corpus: 0 validation
# samples -> the probe returns {} by construction); in-stream val runs on
# the same milestone grid from the train index.
val_heldout_every_steps = 31250
val_heldout_samples = 128
val_every_steps = 31250
val_samples = 128

[sampling]
# SR_v2 streaming venue (2026-09-01 user decision): per-cycle permutation
# OF TARS + intra-tar sequential streaming, no per-sample sampling.
# (data.toml default is the M4-1024-frozen pool sampler — overridden here.)
enabled = true
strategy = "shard_seq"

[logging]
# W&B on: key sourced by the watchdog from the 0600 .env.wandb (file
# channel from salt7, 2026-09-01). Console logging unchanged.
wandb_enabled = true
wandb_entity = "2574905817leaf-jinan-university"
wandb_project = "anime-sr"
wandb_run_name = "sr-v2-6m"
wandb_mode = "online"
log_every_steps = 10
sample_every_steps = 3125
sample_images = 4

[hardware]
dtype = "bf16"
ddp = true
fsdp = false
attention_backend = "sdpa-correctness"
activation_checkpointing = "selective"
# Identical to the Phase I-P formal run — the measured throughput the ETA
# formula is based on.
target_latent_tokens_phase1 = 131072
max_accumulation = 64
overflow_policy = "halve_tokens_lr_x0.7"
