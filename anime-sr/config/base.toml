# AnimeSR-Mage-UFlow — frozen core config v1.0 (plan §21 + §4-§9, frozen 2026-08-26).
# See docs/plan-v2.0.md. Overlay stage files on top:
#   base.toml + stage1_flow.toml  -> M4 Phase I
#   base.toml + stage2_faithful.toml -> M5 Phase II
#   base.toml + smoke.toml        -> M3 smoke model
# Do not edit values without a plan revision; unknown keys are rejected at load.

[project]
name = "anime-sr-mage-uflow"
task = "blind-anime-sr"
scale = 4
text_condition = false
cfg = false
t2i_backbone = false

[model]
latent_channels = 128
latent_downsample = 16
param_budget_m = [121.0, 128.0]
# M0 VAE ceiling decides; off by default (plan §7.5, §13 M0)
grounding_enabled = false

[model.pixel_encoder]
# plan §6.2: 5 scales 256/128/64/32/16, stem 48, 9-12M params
input_scales = [256, 128, 64, 32, 16]
stem_channels = 48
stage_channels = [48, 96, 128, 192, 256]
stage_depths = [2, 2, 3, 3, 4]
param_budget_m = [9.0, 12.0]

[model.uflow]
# plan §7.2 frozen stage table (enc 64/32 -> bot 16 -> dec 32/64 at 1024 HR).
# Dynamic U-Flow (option A): `stride` is relative to the INPUT latent grid, so
# the same table gives 64/32/16/32/64 at 1024, 48/24/12/24/48 at 768,
# 32/16/8/16/32 at 512 (stages not 8-divisible are window-padded at runtime).
head_dim = 64
qk_norm = true
norm = "rms"
activation = "swiglu"
dropout = 0.0
rope = "continuous-2d"
layerscale_init = 0.001
window_shift_pattern = "normal-shifted"
downsample = "pixelunshuffle2-1x1"
upsample = "1x1-pixelshuffle2"
skip_fusion = "concat-1x1"

[[model.uflow.stages]]
stride = 1
dim = 384
depth = 4
q_heads = 6
kv_heads = 2
ffn = 1152
attention = "window-8"

[[model.uflow.stages]]
stride = 2
dim = 512
depth = 6
q_heads = 8
kv_heads = 2
ffn = 1536
attention = "window-8"

[[model.uflow.stages]]
stride = 4
dim = 768
depth = 8
q_heads = 12
kv_heads = 4
ffn = 2304
attention = "global"

[[model.uflow.stages]]
stride = 2
dim = 512
depth = 6
q_heads = 8
kv_heads = 2
ffn = 1536
attention = "window-8"

[[model.uflow.stages]]
stride = 1
dim = 384
depth = 4
q_heads = 6
kv_heads = 2
ffn = 1152
attention = "window-8"

[model.output_head]
# plan §7.4: RMSNorm -> 3x3 (384->384) -> SiLU -> 3x3 (384->128), zero-init out
dim_in = 384
dim_out = 128
zero_init_out = true

[flow]
# plan §5: LQ-centered residual flow, v-prediction only
pred = "v"
sigma_default = 0.0
sigma_finite_bound = 1.0
sigma_modes = { faithful = 0.0, balanced_low = 0.05, balanced_high = 0.10, experimental_max = 0.15 }
# §5.6 initial mix; M3 A/B tests zero-only / 75-25 / 50-50
train_sigma_zero_fraction = 0.75
train_sigma_noise_range = [0.02, 0.15]
solver_4step = "heun"
time_points = [0.0, 0.25, 0.5, 0.75, 1.0]
time_sampling = "uniform"

[buckets]
# plan §10: fixed 4x, LQ 128/192/256 -> HR 512/768/1024 (latent 32/48/64)
lq_sizes = [128, 192, 256]
hr_multiplier = 4
hr_multiple = 64
lq_multiple = 16
latent_divisible_by = 4
area_aspect_constraint = true

[inference]
# plan §12.7: 1-step faithful default, 4-step quality; tiled inference
default_mode = "faithful"
steps_fair = 1
steps_quality = 4
tile_lq = 256
tile_overlap_lq = 64
tile_overlap_hr = 256
tile_blend = "cosine-feather"
tile_padding = "reflect"
rope_absolute_coordinates = true

[vae]
# Mage-VAE weights path (repo rule: missing -> hard error).
# Set via a local overlay or CI secret; pinned into the release manifest (§17.3).
path = ""
expected_sha256 = ""
