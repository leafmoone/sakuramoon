name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    env:
      # Select CPU wheels explicitly; the default PyPI torch build is large
      # and the hosted runner has no accelerator.  The full dependency set is
      # required here: pyright type-checks changed files against the project's
      # third-party types (torch, transformers, ...), so a dev-only env would
      # report every training import as missing.
      UV_TORCH_BACKEND: cpu
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history is required to pin the origin/dev merge-base and to
          # resolve a dev-push GITHUB_BEFORE (existence + ancestry checks run
          # against the cloned objects).  A shallow clone must not silently
          # pass as "no changed files".
          fetch-depth: 0
      # astral-sh/setup-uv has no floating `v10` major tag (only v1-v7
      # float), so the action must be pinned to a concrete version.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      # --no-install-project skips only the editable project link; the
      # project dependencies themselves must be present for pyright.  The
      # train/eval extras carry accelerate, torchao, webdataset and the
      # evaluation stack that the training/production import graph imports.
      - run: uv sync --no-install-project --group dev --extra train --extra eval
      - run: uv run --no-sync ruff check .
      - name: pyright (no new diagnostics in changed python files)
        # GITHUB_BEFORE is not a default GitHub environment variable; map the
        # push event's pre-push SHA so the selector can validate dev pushes.
        env:
          GITHUB_BEFORE: ${{ github.event.before }}
        run: |
          mkdir -p artifacts/pyright
          # Fail-closed base selection: a pull request uses its actual target
          # branch, a feature push uses the origin/dev merge-base, and a dev
          # push uses GITHUB_BEFORE (the true pre-push SHA) so single, merge
          # and multi-commit pushes all produce a real diff.  Zero/unknown/
          # missing/self SHAs and git failures fail this step instead of
          # passing as an empty "no changed files" run.
          base=$(uv run --no-sync python dev-tools/select_pyright_base.py)
          test -n "$base"
          # NUL-delimited paths preserve spaces and unusual filenames. Include
          # every changed Python file, including new files; skip deletions only.
          git diff --name-only -z --diff-filter=d "$base" HEAD -- \
            ':(glob)**/*.py' > artifacts/pyright/changed-files
          FILE_COUNT=$(tr -dc '\0' < artifacts/pyright/changed-files | wc -c)
          echo "pyright base=$base changed_python_files=$FILE_COUNT"
          PYRIGHT_FILES=artifacts/pyright/changed-files uv run --no-sync python - "$base" <<'PY'
          import collections
          import io
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tarfile
          import tempfile

          candidate_root = Path.cwd().resolve()
          output = candidate_root / "artifacts/pyright"
          files = [os.fsdecode(p) for p in Path(os.environ["PYRIGHT_FILES"]).read_bytes().split(b"\0") if p]
          report = {"base": sys.argv[1], "files": files, "python": sys.executable}
          (output / "comparison.json").write_text(json.dumps(report, indent=2), encoding="utf-8")

          def check(root, paths, label):
              if paths:
                  # Reuse the installed interpreter/dependencies, never candidate
                  # source imports in the baseline. Do not sync/install old code.
                  result = subprocess.run(
                      [sys.executable, "-m", "pyright", "--outputjson", "--pythonpath", sys.executable, *paths],
                      cwd=root, env=dict(os.environ, PYTHONPATH=str(root / "src")),
                      capture_output=True, text=True,
                  )
                  (output / f"{label}.json").write_text(result.stdout, encoding="utf-8")
                  (output / f"{label}.stderr.txt").write_text(result.stderr, encoding="utf-8")
                  if result.returncode not in (0, 1):
                      raise RuntimeError(f"{label} pyright exited {result.returncode}: {result.stderr}")
                  data = json.loads(result.stdout)
              else:
                  data = {"generalDiagnostics": [], "summary": {"filesAnalyzed": 0, "errorCount": 0}}
                  (output / f"{label}.json").write_text(json.dumps(data, indent=2), encoding="utf-8")
              # Deliberately ignore line/column shifts, NOT message text or
              # multiplicity. Normalize only the checkout location in messages.
              return collections.Counter(
                  (Path(d["file"]).resolve().relative_to(root).as_posix(), d.get("rule", ""),
                   d["message"].replace(str(root), "<repo>"), d["severity"])
                  for d in data["generalDiagnostics"]
              )

          candidate = check(candidate_root, files, "candidate")
          baseline = collections.Counter()
          if files:
              # Full tracked tree, no .git credentials or untracked secrets, and
              # no checkout/reset/stash in the production worktree. Reject unsafe
              # archive paths/links using Python 3.12's data extraction filter.
              with tempfile.TemporaryDirectory(prefix="pyright-base-") as directory:
                  root = Path(directory).resolve()
                  archive = subprocess.run(["git", "archive", sys.argv[1]], check=True, capture_output=True)
                  with tarfile.open(fileobj=io.BytesIO(archive.stdout)) as tree:
                      tree.extractall(root, filter="data")
                  baseline = check(root, [p for p in files if (root / p).is_file()], "baseline")
          else:
              check(candidate_root, [], "baseline")
          added, removed = candidate - baseline, baseline - candidate
          report.update(old=sum(baseline.values()), candidate=sum(candidate.values()),
                        new=sum(added.values()), removed=sum(removed.values()))
          report["newDiagnostics"] = [
              dict(zip(("path", "rule", "message", "severity"), key), count=count)
              for key, count in sorted(added.items())
          ]
          report["status"] = "failed" if added else "no new diagnostics"
          (output / "comparison.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          print(json.dumps(report, indent=2))
          print("Baseline-aware gate: retained legacy diagnostics are NOT a zero-error result.")
          sys.exit(1 if added else 0)
          PY
      - name: retain pyright baseline and candidate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyright-diagnostics
          path: artifacts/pyright/

  unit:
    runs-on: ubuntu-latest
    env:
      # Select CPU wheels explicitly; the default PyPI torch build is large
      # and the hosted runner has no accelerator.
      UV_TORCH_BACKEND: cpu
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v6
      # Pinned to a concrete version: see the note in the static job.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      # Same optional deps as the static job: the condition-diagnostics
      # structural guard imports sakuramoon.train.runtime, whose module
      # chain needs webdataset/einops (train extra) and pe_spatial deps
      # (eval extra).  CPU wheel selection comes from the job env above.
      - run: uv sync --no-install-project --group dev --extra train --extra eval
      # The optimizer suite is intentionally not in this pytest gate: it
      # exercises torch.compile/triton paths that must be verified on the
      # runner before they can become a required check. The explicit CPU
      # guard-window and missing-gradient regressions are exceptions: real
      # optimizer steps on CPU/Gloo with test-only AdamW/SR adapters. Only the
      # missing-gradient index unit tests substitute the NS kernel boundary.
      # Integration cases below also use explicit CPU boundaries: real clipping,
      # grouping and quantized-state restore, but no native CUDA/SR step claim.
      - run: >-
          PYTHONPATH=src uv run --no-sync pytest
          tests/unit/test_training_metrics_audit.py
          tests/unit/config/test_config_closure.py
          tests/unit/config/test_condition_diagnostics_config.py
          tests/unit/config/test_guard_window_config.py
          tests/unit/data/test_conditioning_batch.py
          tests/unit/train/test_sampling_geometry.py
          tests/unit/train/test_sampling_raw.py
          tests/unit/train/test_sampling_longitudinal.py
          tests/unit/train/test_sampling_cfg_execution.py
          tests/unit/eval/test_prompt_construction.py
          tests/unit/eval/test_concepts.py
          tests/unit/sampling/test_heun.py
          tests/unit/train/test_condition_diagnostics_stream.py
          tests/unit/train/test_condition_diagnostics_production_wiring.py
          tests/unit/train/test_condition_diagnostics_lifecycle.py
          tests/unit/telemetry/test_durable_jsonl_sink.py
          tests/unit/telemetry/test_guard_publish.py
          tests/unit/train/test_guard_window_stream.py
          tests/unit/train/test_guard_window_production_wiring.py
          tests/unit/optim/test_guard_window_gloo.py
          tests/unit/optim/test_missing_gradient_index.py
          tests/unit/optim/test_missing_gradient_gloo.py
          tests/unit/optim/test_optimizer_builder_consolidation.py
          tests/unit/cli/test_guard_window_merge.py
          tests/unit/train/test_condition_optimizer_observability.py
          tests/unit/checkpoint/test_condition_observability_integration.py
          tests/unit/train/test_condition_dual_stream_integration.py
          tests/unit/train/test_ci_pyright_base.py
          -q

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # `bash -n a.sh b.sh` only checks the first file, so walk each script.
      - name: shell syntax
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find scripts -type f -name '*.sh' -print0)
      - name: config inheritance graph
        run: python3 scripts/check_configs.py --config-root config
      # v3 is the Node 24 action.  PR comments are disabled so the job does
      # not need pull-requests write permission.  GITLEAKS_LICENSE is only
      # required for organization-owned repositories.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
