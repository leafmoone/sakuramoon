name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.x"
      - run: uv python install 3.11
      # Static checks do not need the training stack.
      - run: uv sync --no-install-project --only-group dev
      - run: uv run ruff check .
      - run: uv run pyright

  unit:
    runs-on: ubuntu-latest
    env:
      # Select CPU wheels explicitly; the default PyPI torch build is large
      # and the hosted runner has no accelerator.
      UV_TORCH_BACKEND: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.x"
      - run: uv python install 3.11
      - run: uv sync --no-install-project --group dev --extra data-tools
      # torchao lives in the training extra; install it alone so the test
      # subset below can import the optimizer without pulling wandb,
      # modelscope or the other training-only packages.
      - run: uv pip install --python .venv/bin/python --no-deps "torchao>=0.16,<0.17"
      # Start with a small, dependency-closed subset.  Expand it only after
      # the job is green; adding the whole tree at once hides collection
      # failures behind a long red run.
      - run: >-
          PYTHONPATH=src uv run pytest
          tests/unit/test_training_metrics_audit.py
          tests/unit/config/test_config_closure.py
          tests/unit/optim/test_fp32_rescue.py
          -q

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # `bash -n a.sh b.sh` only checks the first file, so walk each script.
      - name: shell syntax
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find scripts -type f -name '*.sh' -print0)
      - name: config inheritance graph
        run: python scripts/check_configs.py --config-root config
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
